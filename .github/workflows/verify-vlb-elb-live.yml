name: Verify existing VLB and ELB production access
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_248B6AEDDDF04A74B67402B5BD0DC3EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B5963E6143745DD89CD80664168F76E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D6C9CBBB0A24F138D5B5B2F35480688 }}
      - name: Verify deployed VLB shift distance and reset readings
        run: |
          node --input-type=commonjs <<'NODE'
          const {execFileSync}=require('node:child_process');
          (async()=>{
           const deadline=Date.now()+15*60*1000;
           for(;;){
            try{
             const response=await fetch('https://pulse-ll.cmll.in/api/health?vlb-meter-check='+Date.now(),{signal:AbortSignal.timeout(12000)});
             const health=await response.json();
             if(health.status==='ok'&&health.database==='connected'&&health.commit==='ab827c996c5a50e308ba336d016c5a564bca503f')break;
            }catch{}
            if(Date.now()>deadline)throw Error('Expected production release did not become healthy');
            await new Promise(resolve=>setTimeout(resolve,15000));
           }
           const token=execFileSync('az',['account','get-access-token','--resource','https://management.azure.com/','--query','accessToken','-o','tsv'],{encoding:'utf8'}).trim();
           const encoded=Buffer.from("const assert=require('node:assert/strict');\n(async()=>{\n const root=process.env.VLB_PROBE_ROOT||'file:///home/site/wwwroot/';\n const {normalizeLogBook}=await import(root+'server/routes/log-book.mjs');\n const {assertCombinedShiftMeters}=await import(root+'server/rules/log-book-shift-hmr.mjs');\n const normal={bookDate:'2026-12-30',location:'Sasti OC',assetId:1,employeeId:2,shiftId:3,cardShift:'I',shiftHours:8,openingHmr:100,closingHmr:104,openingKmr:20,closingKmr:30,trips:[]};\n const saved=normalizeLogBook('vehicle',normal);\n assert.deepEqual([saved.openingKmr,saved.openingHmr,saved.totalRunningKmr],[20,100,10]);\n const readOnly={query:async (sql,args)=>{\n   assert.match(sql.trim(),/^SELECT\\b/i);\n   assert.deepEqual(args,['vehicle',normal.bookDate,normal.assetId,null]);\n   return {rows:[{site:normal.location,data:saved}]};\n }};\n const second={...normal,openingHmr:104,closingHmr:108,openingKmr:30};\n for(const replacement of [false,true]){\n   const data=distance=>normalizeLogBook('vehicle',replacement\n     ?{...second,closingKmr:5,replacementKmr:distance}\n     :{...second,closingKmr:second.openingKmr+distance});\n   assert.equal(data(240).totalRunningKmr,240);\n   await assertCombinedShiftMeters(readOnly,'vehicle',data(240));\n   await assert.rejects(()=>assertCombinedShiftMeters(readOnly,'vehicle',data(240.001)),\n     error=>error.status===409&&error.details?.code==='shift_kmr_limit'&&/250\\.001 km/.test(error.message));\n }\n console.log('Deployed VLB server accepted opening KMR 20 below opening HMR 100. Combined 250 km passed and 250.001 km was rejected for both ordinary and replacement meters. No production records were written.');\n})().catch(e=>{console.error(e.message);process.exitCode=1});").toString('base64');
           const command='/bin/bash -c "printf %s '+encoded+' | base64 -d | NODE_PATH=/home/data/vlb-elb-verification-runtime-20261029/node_modules:/home/site/wwwroot/node_modules:/node_modules node --input-type=commonjs"';
           const response=await fetch('https://caliber-mis-783-gebxgedygkaba9db.scm.centralindia-01.azurewebsites.net/api/command',{
             method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
             body:JSON.stringify({command,dir:'/home/site/wwwroot'}),signal:AbortSignal.timeout(120000)});
           if(!response.ok)throw Error('Azure command HTTP '+response.status);
           const result=await response.json();
           console.log(result.Output||'');
           if(result.ExitCode!==0)throw Error(result.Error||'Deployed rule check failed');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
