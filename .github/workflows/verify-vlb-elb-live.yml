name: Verify deployed VLB and ELB shared shifts
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_248B6AEDDDF04A74B67402B5BD0DC3EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B5963E6143745DD89CD80664168F76E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D6C9CBBB0A24F138D5B5B2F35480688 }}
      - name: Exercise the deployed save and report paths in a rolled-back schema
        run: |
          node --input-type=commonjs <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {readFileSync}=require('node:fs');
          (async()=>{
           const expected='9182c3d20461a3ca5c157e1e4d8b678f54dae537';
           const deadline=Date.now()+25*60*1000;
           while(true){
            const health=await fetch('https://pulse-ll.cmll.in/api/health?shared-shift='+expected,{signal:AbortSignal.timeout(12000)}).then(r=>r.json()).catch(()=>null);
            if(health?.status==='ok'&&health.database==='connected'&&health.commit===expected)break;
            if(Date.now()>deadline)throw Error('Expected release did not become healthy: '+expected);
            await new Promise(r=>setTimeout(r,15000));
           }
           console.log('Healthy production release '+expected);
           const token=execFileSync('az',['account','get-access-token','--resource','https://management.azure.com/','--query','accessToken','-o','tsv'],{encoding:'utf8'}).trim();
           const encoded=readFileSync('scripts/verify-shared-shift-release.cjs').toString('base64');
           const command='/bin/bash -c "printf %s '+encoded+' | base64 -d | NODE_PATH=/home/data/vlb-elb-verification-runtime-20261029:/home/data/vlb-elb-verification-runtime-20261029/node_modules:/home/site/wwwroot/node_modules:/node_modules node --input-type=commonjs"';
           const response=await fetch('https://caliber-mis-783-gebxgedygkaba9db.scm.centralindia-01.azurewebsites.net/api/command',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({command,dir:'/home/site/wwwroot'}),signal:AbortSignal.timeout(120000)});
           if(!response.ok)throw Error('Azure command HTTP '+response.status);
           const result=await response.json();
           console.log(result.Output||'');
           if(result.ExitCode!==0)throw Error(result.Error||'Remote verification failed');
          })().catch(error=>{console.error(error.message);process.exitCode=1});
          NODE
