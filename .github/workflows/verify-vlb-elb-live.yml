name: Verify existing VLB and ELB production access
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_248B6AEDDDF04A74B67402B5BD0DC3EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B5963E6143745DD89CD80664168F76E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D6C9CBBB0A24F138D5B5B2F35480688 }}
      - name: Check a saved cross-shift VLB handover in a read-only transaction
        run: |
          node --input-type=commonjs <<'NODE'
          const {execFileSync}=require('node:child_process');
          (async()=>{
           const token=execFileSync('az',['account','get-access-token','--resource','https://management.azure.com/','--query','accessToken','-o','tsv'],{encoding:'utf8'}).trim();
           const encoded=Buffer.from("const {Pool}=require('pg');\n(async()=>{\n const {misDatabaseConfig}=await import('file:///home/site/wwwroot/server/rules/mis-database-config.mjs');\n const {withVlbTripHandovers}=await import('file:///home/site/wwwroot/shared/vlb-trip-handover.mjs');\n const {vlbRecordShift}=await import('file:///home/site/wwwroot/shared/vlb-batch-format.mjs');\n const pool=new Pool({...misDatabaseConfig(),connectionTimeoutMillis:12000,statement_timeout:20000,max:1});\n try{\n  const c=await pool.connect();\n  try {\n   await c.query('BEGIN READ ONLY');\n   const {rows}=await c.query(`SELECT id,book_no,book_type,site,data FROM mis_log_books\n    WHERE book_type='vehicle' AND deleted_at IS NULL AND book_date>=DATE '2026-11-01'\n    AND EXISTS (SELECT 1 FROM jsonb_array_elements(data->'trips') t\n      WHERE (COALESCE(t->>'loadingTime','')='') <> (COALESCE(t->>'unloadingTime','')=''))\n    ORDER BY book_date DESC,id DESC LIMIT 4000`);\n   const linked=await withVlbTripHandovers(c,rows);\n   const byId=new Map(linked.map(r=>[String(r.id),r]));\n   let found;\n   for(const end of linked){\n    const t=end.data.trips.find(row=>!row.loadingTime&&row.unloadingTime&&row.handoverLinks.some(x=>x.role==='unloading'&&x.tripCount===1));\n    const link=t?.handoverLinks.find(x=>x.role==='unloading'&&x.tripCount===1);\n    if(!link||t.loadingTime||!t.unloadingTime||!end.data.scanCardId)continue;\n    const start=byId.get(link.counterpart.logBookId);\n    const loadingRow=start?.data.trips[link.counterpart.row-1];\n    if(!loadingRow||loadingRow.unloadingTime||!loadingRow.loadingTime)continue;\n    const loadShift=vlbRecordShift(start.data),unloadShift=vlbRecordShift(end.data);\n    if(!loadShift||!unloadShift||loadShift===unloadShift)continue;\n    const {rows:[scan]}=await c.query('SELECT status,COALESCE(error,$$ $$) ~ $$[^[:space:]]$$ AS has_error FROM mis_scan_cards WHERE id=$1 AND logbook_id=$2',[end.data.scanCardId,end.id]);\n    if(scan?.status!=='posted')continue;\n    found={vehicle:start.data.door,site:start.site,loading:{book:start.book_no,date:start.data.bookDate,shift:loadShift,time:loadingRow.loadingTime,trips:start.data.totalTrips},unloading:{book:end.book_no,date:end.data.bookDate,shift:unloadShift,time:t.unloadingTime,trips:end.data.totalTrips,handoverStatus:t.tripStatus,scanStatus:scan.status,hasScanError:scan.has_error}};\n    if(!scan.has_error&&found.loading.trips===1&&found.unloading.trips===0)break;\n   }\n   console.log(JSON.stringify({candidateCards:rows.length,example:found??null}));\n  } finally {await c.query('ROLLBACK');c.release();}\n }finally{await pool.end();}\n})().catch(e=>{console.error(e.code||e.name,e.message.replace(/postgres(?:ql)?:\\S+/gi,'[redacted]'));process.exitCode=1;});").toString('base64');
