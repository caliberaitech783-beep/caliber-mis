name: Build and deploy Node.js app to Azure Web App - caliber-mis-783

on:
  push:
    branches: [main]
  workflow_dispatch:

# Finish an active release safely; GitHub replaces superseded pending runs.
concurrency:
  group: caliber-mis-783-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      startup-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release_check
          POSTGRES_PASSWORD: release_check
          POSTGRES_DB: caliber_mis
        ports: ['54320:5432']
        options: >-
          --health-cmd "pg_isready -U release_check -d caliber_mis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js and npm download cache
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Restore pinned handwriting model cache
        uses: actions/cache@v4
        with:
          path: ocr-model-cache
          key: trocr-${{ runner.os }}-node22-${{ hashFiles('handwritten-card-ocr.mjs', 'package-lock.json') }}

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify pinned handwriting model
        run: npm run ocr:prepare

      - name: Build complete UI
        run: npm run build

      - name: Run full test suite
        env:
          DELETION_TEST_DATABASE_URL: postgres://release_check:release_check@127.0.0.1:54320/caliber_mis
        run: npm test

      - name: Verify built release identity
        run: |
          EXPECTED_COMMIT="$GITHUB_SHA" node scripts/verify-ui-release.mjs
          printf '%s\n' "$GITHUB_SHA" > DEPLOYMENT_SHA

      - name: Verify complete deployment runtime
        env:
          RELEASE_CHECK_DATABASE_URL: postgres://release_check:release_check@127.0.0.1:54320/caliber_mis
        run: |
          node --check server.mjs
          node scripts/verify-server-start.mjs
          node --input-type=module -e "await import('./local-card-ocr.mjs'); await import('./report-xlsx.mjs')"
          node --input-type=module -e "const {env}=await import('@huggingface/transformers'); env.allowRemoteModels=false; const {loadHandwritingModel}=await import('./handwritten-card-ocr.mjs'); const model=await loadHandwritingModel(); await model.dispose(); console.log('Pinned OCR model verified offline.')"

      # Keep the complete workspace format that Azure already runs.
      # Build and deployment share one runner, avoiding the large artifact transfer.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_248B6AEDDDF04A74B67402B5BD0DC3EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B5963E6143745DD89CD80664168F76E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D6C9CBBB0A24F138D5B5B2F35480688 }}

      - name: Configure central Gemini extraction for VLB and ELB
        env:
          GEMINI_API_KEY: ${{ secrets.MIS_GEMINI_API_KEY }}
        run: python3 scripts/configure-gemini-azure.py

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'caliber-mis-783'
          slot-name: 'Production'
          # Deploy the complete validated workspace. The reduced ZIP package
          # left Azure without a startable application and returned HTTP 503.
          package: .

      - name: Verify Pulse-II release health
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 20 "https://pulse-ll.cmll.in/api/health?gemini-release=${EXPECTED_COMMIT}" -o health.json && node -e "const h=require('./health.json');if(h.commit!==process.env.EXPECTED_COMMIT)process.exit(1)" && node scripts/verify-ui-release.mjs --live; then
              echo "Pulse-II is serving the Gemini release."
              exit 0
            fi
            sleep 10
          done
          echo "Pulse-II release health could not be verified."
          exit 1
