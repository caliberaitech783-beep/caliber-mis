name: Diagnose MIS deployment
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which app to read'
        type: choice
        options: [pulse, scan-engine]
        default: pulse
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mis-deployment.yml'
      - 'scripts/diagnose-mis-deployment.py'
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_248B6AEDDDF04A74B67402B5BD0DC3EB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6B5963E6143745DD89CD80664168F76E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D6C9CBBB0A24F138D5B5B2F35480688 }}
      - name: Read deployment and startup health
        if: inputs.target != 'scan-engine'
        run: node scripts/probe-ui-delta.mjs
      # Read-only: the last deployments, the deployment lock and the running processes of both slots.
      - name: Read why a slot refuses a new deployment
        if: always()
        env:
          MIS_STAGING_SLOT: ${{ vars.MIS_STAGING_SLOT || 'staging' }}
          PROBE_APP: ${{ inputs.target == 'scan-engine' && vars.SCAN_ENGINE_APP || '' }}
        run: node scripts/probe-slot-deployment-state.mjs
      # Read-only: what the staging slot lacks compared with production (names and kinds, never values), and the
      # newest start-up logs of its app.
      - name: Compare the staging slot with production
        if: always() && inputs.target != 'scan-engine'
        env:
          MIS_STAGING_SLOT: ${{ vars.MIS_STAGING_SLOT || 'staging' }}
        run: node scripts/probe-slot-configuration.mjs
      - name: Read scan engine startup logs
        if: always() && inputs.target == 'scan-engine'
        env:
          SCAN_ENGINE_APP: ${{ vars.SCAN_ENGINE_APP }}
        run: node scripts/probe-scan-engine-startup.mjs
