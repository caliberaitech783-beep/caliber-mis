<!doctype html><html><head><meta charset="utf-8"><title>Caliber PC Scanner Connector</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;max-width:760px;margin:36px auto;padding:20px;color:#231b30;background:#faf6fc}h1{color:#62328d}input,select,button{font:inherit;padding:12px;margin:8px 4px;border:1px solid #cdbbdf;border-radius:8px}button{cursor:pointer;background:#62328d;color:white}button:disabled{opacity:.5}#message{white-space:pre-wrap;padding:18px;background:white;border-radius:12px}label{display:block}</style></head><body><h1>Caliber PC Scanner Connector</h1><p>This window accesses your Windows scanner. Clicking Scan sends its pages to <strong>https://pulse-ll.cmll.in</strong> for manual review. Log books are not saved automatically.</p><section id="scanner" hidden><label>Connected scanner<select id="device"></select></label><button id="refresh">Refresh scanners</button><button id="scan">Scan and send to online MIS</button><button id="folder">Read scan-folder PDFs and send</button><button id="retry" hidden>Retry sending retained pages</button></section><p id="message" role="status">Connecting to local scanner service…</p><script type="module" src="/scanner-connector.js"></script></body></html>
